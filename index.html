      </div>
    </section>
    <section className="box">
      <h2>Google Drive sync</h2>
      ${!GOOGLE_CLIENT_ID
        ? html`<p className="hint" style=${{ marginBottom: '10px' }}>Drive sync is off. To turn it on, deploy with the included GitHub Actions workflow and set the <code>GOOGLE_CLIENT_ID</code> repository variable (see README). Until then, use Import JSON and Export JSON.</p>`
        : !drive.available
        ? html`<p className="hint">Google sign-in couldn't load here. Open the app from its hosted address to use Drive sync.</p>`
        : html`<p className="hint" style=${{ marginBottom: '14px' }}>${drive.linked
              ? 'This device saves to ' + DRIVE_FILE_NAME + ' in your Google Drive automatically after each change. Open the app on another device and tap Sync with Drive to get the same data.'
              : 'Connect once and every change is saved to ' + DRIVE_FILE_NAME + ' in your Google Drive, so your phone and laptop share the same data.'}</p>
            <div className="actions">
              ${!drive.connected && html`<button className="btn primary" onClick=${drive.onConnect}>${drive.linked ? 'Sync with Drive' : 'Connect Google Drive'}</button>`}
              ${drive.connected && html`<button className="btn" onClick=${drive.onSaveNow}>Save to Drive now</button>`}
              ${drive.linked && html`<button className="btn quiet" onClick=${drive.onDisconnect}>Disconnect</button>`}
            </div>`}
    </section>
    ${extra}
    <section className="box danger-zone">
      <h2>Start over</h2>
      <p className="hint" style=${{ marginBottom: '14px' }}>Clears everything on this device. Export JSON first if you want to keep a copy.</p>
      <button className="btn danger" onClick=${onReset}>Clear all data</button>
    </section>
  </div>`;
}

/* ---------- app ---------- */
function App({ initial, initialLock, onLock }) {
  const [data, setData] = useState(initial);
  const [lock, setLock] = useState(initialLock || null);
  const persistRef = useRef(Promise.resolve());
  const [lastExport, setLastExport] = useState(() => { try { return localStorage.getItem(STORE_KEY + ':exported') || ''; } catch (e) { return ''; } });
  const [tab, setTab] = useState('overview');
  const [modal, setModal] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [toast, setToast] = useState('');
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);

  /* Drive sync state */
  const [driveAvail, setDriveAvail] = useState(false);
  const [connected, setConnected] = useState(false);
  const [link, setLink] = useState(() => { try { return JSON.parse(localStorage.getItem(LINK_KEY)) || null; } catch (e) { return null; } });
  const [sync, setSync] = useState({ status: 'idle', message: '' });
  const [conflict, setConflict] = useState(null);
  const dataRef = useRef(data); dataRef.current = data;
  const linkRef = useRef(link);
  const statusRef = useRef(sync.status); statusRef.current = sync.status;
  const saveTimer = useRef(null);
  useEffect(() => { Drive.load().then(setDriveAvail); }, []);

  const saveLink = l => { linkRef.current = l; setLink(l); try { l ? localStorage.setItem(LINK_KEY, JSON.stringify(l)) : localStorage.removeItem(LINK_KEY); } catch (e) {} };
  const driveFail = e => {
    if (e.code === 'auth') { setConnected(false); setSync({ status: 'expired', message: e.message }); }
    else setSync({ status: 'error', message: e.message });
  };
  const pushLocal = async fileId => {
    const d = dataRef.current;
    const res = fileId ? await Drive.write(fileId, d) : await Drive.create(d);
    saveLink({ fileId: res.id, modified: res.modifiedTime, base: d.updatedAt || null });
    setSync({ status: 'saved', message: '' });
  };
  const takeRemote = (remote, meta) => {
    saveLink({ fileId: meta.id, modified: meta.modifiedTime, base: remote.updatedAt || null });
    setData(remote);
    setSync({ status: 'saved', message: '' });
  };
  const connectDrive = async () => {
    setSync({ status: 'working', message: '' });
    try {
      await Drive.signIn(); setConnected(true);
      const l = linkRef.current; let meta = null;
      if (l && l.fileId) { try { meta = await Drive.meta(l.fileId); if (meta.trashed) meta = null; } catch (e) { if (e.code === 'auth') throw e; } }
      if (!meta) meta = await Drive.find();
      if (!meta) { await pushLocal(null); setToast('Created ' + DRIVE_FILE_NAME + ' in your Google Drive.'); return; }
      const remote = normalize(await Drive.read(meta.id));
      const local = dataRef.current;
      const base = l && l.fileId === meta.id ? l.base : undefined;
      const localChanged = !!local.updatedAt && local.updatedAt !== base;
      const remoteChanged = remote.updatedAt !== base;
      if (!localChanged || remote.updatedAt === local.updatedAt) { takeRemote(remote, meta); setToast('Synced with Google Drive.'); }
      else if (!remoteChanged) { await pushLocal(meta.id); setToast("Saved this device's changes to Drive."); }
      else { setConflict({ remote, meta }); setSync({ status: 'conflict', message: '' }); }
    } catch (e) { driveFail(e); setToast(e.message); }
  };
  const saveToDrive = async () => {
    const l = linkRef.current;
    if (!l || !Drive.hasToken()) return;
    setSync({ status: 'working', message: '' });
    try {
      const meta = await Drive.meta(l.fileId);
      if (meta.trashed) { await pushLocal(null); return; }
      if (meta.modifiedTime !== l.modified) {
        const remote = normalize(await Drive.read(l.fileId));
        if (remote.updatedAt !== l.base) { setConflict({ remote, meta }); setSync({ status: 'conflict', message: '' }); return; }
      }
      await pushLocal(l.fileId);
    } catch (e) {
      if (e.status === 404) { try { await pushLocal(null); } catch (e2) { driveFail(e2); } }
      else driveFail(e);
    }
  };
  useEffect(() => {
    const l = linkRef.current;
    if (!connected || !l || ['conflict', 'expired'].includes(statusRef.current) || data.updatedAt === l.base) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(saveToDrive, 1500);
    return () => clearTimeout(saveTimer.current);
  }, [data, connected]);
  const useDriveVersion = () => { const c = conflict; setConflict(null); takeRemote(c.remote, c.meta); setToast('Loaded the Drive version.'); };
  const keepLocal = async () => {
    const c = conflict; setConflict(null); setSync({ status: 'working', message: '' });
    try { await pushLocal(c.meta.id); setToast("Drive now has this device's version."); } catch (e) { driveFail(e); }
  };
  const disconnectDrive = () => { Drive.signOut(); saveLink(null); setConnected(false); setConflict(null); setSync({ status: 'idle', message: '' }); setToast('Disconnected from Google Drive.'); };

  useEffect(() => {
    let stale = false;
    persistRef.current = (async () => {
      try {
        const value = JSON.stringify(lock ? await sealData(lock, data) : data);
        if (!stale) localStorage.setItem(STORE_KEY, value);
      } catch (e) {}
    })();
    return () => { stale = true; };
  }, [data, lock]);
  const doLock = async () => { clearTimeout(saveTimer.current); await persistRef.current; onLock(); };
  useEffect(() => {
    if (!lock) return;
    let last = Date.now();
    const bump = () => { last = Date.now(); };
    const check = () => { if (Date.now() - last > LOCK_AFTER_MS) doLock(); };
    const vis = () => { if (document.visibilityState === 'visible') { check(); bump(); } };
    const evs = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
    evs.forEach(ev => window.addEventListener(ev, bump, { passive: true }));
    document.addEventListener('visibilitychange', vis);
    const t = setInterval(check, 30000);
    return () => { evs.forEach(ev => window.removeEventListener(ev, bump)); document.removeEventListener('visibilitychange', vis); clearInterval(t); };
  }, [lock]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 3500); return () => clearTimeout(t); }, [toast]);

  const s = useMemo(() => summarize(data), [data]);
  const update = fn => setData(d => ({ ...fn(d), updatedAt: new Date().toISOString() }));
  const markExported = () => { const t = new Date().toISOString(); setLastExport(t); try { localStorage.setItem(STORE_KEY + ':exported', t); } catch (e) {} };
  const unsaved = !!data.updatedAt && (!lastExport || data.updatedAt > lastExport);
  const P = data.property;
  const baseName = 'land-ledger-' + slug(P.name) + '-' + todayISO();

  const exportJson = async () => {
    setBusy(true);
    try {
      const r = await offerFile(baseName + '.json', JSON.stringify(data, null, 2), 'application/json');
      if (r === 'saved') { markExported(); setToast('JSON exported.'); } else setToast('Export cancelled.');
    } catch (e) { setToast(e.message); } finally { setBusy(false); }
  };
  const exportExcel = async () => {
    setBusy(true);
    try {
      const buf = buildWorkbook(data, s);
      const r = await offerFile(baseName + '.xlsx', buf, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      setToast(r === 'saved' ? 'Excel file downloaded.' : 'Download cancelled.');
    } catch (e) { setToast(e.message || 'The Excel file could not be created.'); } finally { setBusy(false); }
  };
  const onFile = async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const parsed = normalize(JSON.parse(await file.text()));
      const apply = () => { setData({ ...parsed, updatedAt: new Date().toISOString() }); markExported(); setTab('overview'); setToast('Imported ' + file.name + '.'); };
      if (data.payments.length || data.loans.length || data.property.name) {
        setConfirm({ title: 'Replace current data?', text: 'Importing ' + file.name + ' replaces everything currently in the app.', yes: 'Import and replace', run: apply });
      } else apply();
    } catch (err) { setToast(err instanceof SyntaxError ? 'That file is not valid JSON.' : err.message); }
  };

  const savePayment = p => { update(d => ({ ...d, payments: d.payments.some(x => x.id === p.id) ? d.payments.map(x => x.id === p.id ? p : x) : [...d.payments, p] })); setModal(null); setToast(modal.item ? 'Payment updated.' : 'Payment added.'); };
  const [loanSel, setLoanSel] = useState(null);
  const updLoan = (id, fn) => update(d => ({ ...d, loans: d.loans.map(l => l.id === id ? fn(l) : l) }));
  const getLoan = id => data.loans.find(l => l.id === id);
  const resched = l => { try { return { ...l, emis: buildSchedule(l, [...l.emis].sort((a, b) => a.no - b.no)) }; } catch (e) { setToast(e.message); return l; } };
  const saveLoan = l => {
    const exists = data.loans.some(x => x.id === l.id);
    update(d => ({ ...d, loans: exists ? d.loans.map(x => x.id === l.id ? l : x) : [...d.loans, l] }));
    setLoanSel(l.id); setModal(null); setToast(exists ? 'Loan saved.' : 'Loan added.');
  };
  const deleteLoan = id => { const l = getLoan(id); setConfirm({ title: 'Delete ' + loanName(l) + '?', text: 'The loan, its payment schedule and part payments are removed. This can\'t be undone unless you re-import an earlier JSON export.', yes: 'Delete loan', danger: true,
    run: () => { update(d => ({ ...d, loans: d.loans.filter(x => x.id !== id) })); setLoanSel(null); setToast('Loan deleted.'); } }); };
  const rebuild = id => setConfirm({ title: 'Rebuild the schedule?', text: 'The schedule is recalculated from the loan terms and part payments. Payments already marked paid stay as they are; manual edits to pending rows are replaced.', yes: 'Rebuild schedule',
    run: () => { updLoan(id, resched); setToast('Schedule rebuilt.'); } });
  const savePrepay = (id, x) => { updLoan(id, l => resched({ ...l, prepayments: [...l.prepayments, x] })); setModal(null); setToast('Part payment saved and schedule updated.'); };
  const deletePrepay = (id, x) => setConfirm({ title: 'Delete this part payment?', text: 'The ' + inr(x.amount) + ' part payment on ' + fdate(x.date) + ' is removed and the schedule is recalculated without it.', yes: 'Delete', danger: true,
    run: () => { updLoan(id, l => resched({ ...l, prepayments: l.prepayments.filter(y => y.id !== x.id) })); setToast('Part payment deleted.'); } });
  const toggleRow = (id, e) => updLoan(id, l => ({ ...l, emis: l.emis.map(x => x.id === e.id ? { ...x, status: x.status === 'paid' ? 'pending' : 'paid', paidDate: x.status === 'paid' ? '' : todayISO() } : x) }));
  const saveRow = (id, em) => { updLoan(id, l => ({ ...l, emis: l.emis.some(x => x.id === em.id) ? l.emis.map(x => x.id === em.id ? em : x) : [...l.emis, em] })); setModal(null); setToast('Saved.'); };
  const deleteRow = (id, e) => setConfirm({ title: 'Delete payment ' + e.no + '?', text: 'This row is removed from the schedule.', yes: 'Delete', danger: true,
    run: () => { updLoan(id, l => ({ ...l, emis: l.emis.filter(x => x.id !== e.id) })); setToast('Deleted.'); } });
  const loanHandlers = {
    addLoan: type => setModal({ type: 'loan', loan: blankLoan(type), isNew: true }),
    editLoan: id => setModal({ type: 'loan', loan: getLoan(id), isNew: false }),
    deleteLoan, rebuild,
    prepay: id => setModal({ type: 'prepay', loanId: id }), deletePrepay,
    toggle: toggleRow, deleteRow,
    addRow: id => setModal({ type: 'row', loanId: id }),
    editRow: (id, e) => setModal({ type: 'row', loanId: id, item: e }),
  };
  const del = (kind, item, label) => setConfirm({ title: 'Delete ' + label + '?', text: 'This can\'t be undone unless you re-import an earlier JSON export.', yes: 'Delete', danger: true,
    run: () => { update(d => ({ ...d, [kind]: d[kind].filter(x => x.id !== item.id) })); setToast('Deleted.'); } });

  const go = (t, add) => { setTab(t); if (add) setModal({ type: 'payment' }); };
  const tabs = [['overview', 'Overview'], ['payments', 'Payments', data.payments.length], ['loans', 'Loans', data.loans.length], ['property', 'Property details']];
  const driveSynced = connected && link && data.updatedAt === link.base && sync.status !== 'working';
  let driveUI = null;
  if (driveAvail) {
    if (!connected) driveUI = html`<button className="btn full" onClick=${connectDrive} disabled=${sync.status === 'working'}>${sync.status === 'working' ? 'Connecting…' : link ? 'Sync with Drive' : 'Connect Google Drive'}</button>`;
    else if (sync.status === 'error') driveUI = html`<span className="sync"><i className="err" />Drive save failed <button className="btn small" onClick=${saveToDrive}>Retry</button></span>`;
    else if (sync.status === 'conflict') driveUI = html`<span className="sync"><i className="err" />Choose a version below</span>`;
    else driveUI = html`<span className="sync"><i className=${driveSynced ? '' : 'warn'} />${driveSynced ? 'Saved to Drive' : 'Saving to Drive…'}</span>`;
  }
  const meta = [P.location, P.surveyNo && 'Survey no. ' + P.surveyNo, P.area && P.area + ' ' + P.areaUnit].filter(Boolean).join(', ');

  return html`<div className="wrap">
    <header className="top">
      <div>
        <h1>${P.name || 'My land purchase'}</h1>
        <p className="sub">${meta || 'Add the land details under Property details.'}</p>
      </div>
      <div className="actions">
        ${driveUI}
        ${lock && html`<button className="btn" onClick=${doLock}>Lock</button>`}
        <input ref=${fileRef} type="file" accept=".json,application/json" hidden onChange=${onFile} />
        <button className="btn" onClick=${() => fileRef.current.click()}>Import JSON</button>
        <button className="btn" onClick=${exportJson} disabled=${busy}>Export JSON</button>
        <button className="btn primary full" onClick=${exportExcel} disabled=${busy}>Download Excel</button>
      </div>
    </header>
    ${conflict && html`<div className="notice conflict"><span>Your Drive copy was changed on another device${conflict.remote.updatedAt ? ' (last edit ' + new Date(conflict.remote.updatedAt).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) + ')' : ''}. Which version do you want to keep?</span>
      <div className="btns"><button className="btn small" onClick=${useDriveVersion}>Use Drive version</button><button className="btn small" onClick=${keepLocal}>Keep this device's version</button></div></div>`}
    ${unsaved && !link && html`<div className="notice"><span>You have changes that aren't in an exported JSON file yet.</span><button className="btn small" onClick=${exportJson} disabled=${busy}>Export JSON now</button></div>`}

    <section className="hero">
      <${PlotFigure} pct=${s.pct} surveyNo=${P.surveyNo} />
      <div className="headline">
        <p className="lede">Paid toward the land</p>
        <p className="big">${inr(s.towardPrice)}</p>
        ${s.totalCost > 0
          ? html`<p className="of">of ${inr(s.totalCost)} agreed with the seller. ${s.balance > 0 ? html`<strong>${inr(s.balance)}</strong> still due.` : 'Fully paid.'}</p>`
          : html`<p className="of">Set the agreed land price to track how much is left to pay. <button className="btn small" onClick=${() => setTab('property')}>Add land price</button></p>`}
      </div>
      <dl className="ledger">
          <div><dt>Your own money spent</dt><dd>${inr(s.pocket)}</dd></div>
          <div><dt>Additional costs</dt><dd>${inr(s.additional)}</dd></div>
          <div><dt>Loan payments made</dt><dd>${s.emiPaidCount} <small>of ${s.emiCount}</small></dd></div>
          <div><dt>Loans outstanding</dt><dd>${inr(s.loanOutstanding)}</dd></div>
      </dl>
    </section>

    <nav className="tabs" role="tablist">
      ${tabs.map(([id, label, count]) => html`<button key=${id} className="tab" role="tab" aria-selected=${tab === id} onClick=${() => setTab(id)}>${label}${count ? html`<span className="count">${count}</span>` : null}</button>`)}
    </nav>
    <main className="panel">
      ${tab === 'overview' && html`<${Overview} data=${data} s=${s} go=${go} />`}
      ${tab === 'payments' && html`<${Payments} data=${data}
          onAdd=${() => setModal({ type: 'payment' })} onEdit=${p => setModal({ type: 'payment', item: p })}
          onDelete=${p => del('payments', p, 'this payment of ' + inr(p.amount))} />`}
      ${tab === 'loans' && html`<${Loans} data=${data} s=${s} sel=${loanSel} setSel=${setLoanSel} on=${loanHandlers} />`}
      ${tab === 'property' && html`<${Property} data=${data} update=${update}
          extra=${html`<${LockSettings} lock=${lock} onLockNow=${doLock}
            onEnable=${async pass => { setLock(await makeLock(pass)); setToast('App lock is on.'); }}
            onDisable=${async () => { setLock(null); setToast('App lock is off.'); }} />`}
          drive=${{ available: driveAvail, linked: !!link, connected, onConnect: connectDrive, onDisconnect: disconnectDrive, onSaveNow: saveToDrive }}
          onReset=${() => setConfirm({ title: 'Clear all data?', text: 'Every payment, loan and property detail is removed from this device.' + (link ? ' Your Drive file is left as it is, and this device is disconnected from it.' : ''), yes: 'Clear everything', danger: true,
            run: () => { if (link) { Drive.signOut(); saveLink(null); setConnected(false); setSync({ status: 'idle', message: '' }); } setData(blank()); setTab('overview'); setToast('All data cleared.'); } })} />`}
    </main>

    ${modal && modal.type === 'payment' && html`<${PaymentForm} item=${modal.item} onSave=${savePayment} onClose=${() => setModal(null)} />`}
    ${modal && modal.type === 'row' && getLoan(modal.loanId) && html`<${EmiForm} item=${modal.item} nextNo=${getLoan(modal.loanId).emis.reduce((m, e) => Math.max(m, e.no), 0) + 1} onSave=${em => saveRow(modal.loanId, em)} onClose=${() => setModal(null)} />`}
    ${modal && modal.type === 'prepay' && getLoan(modal.loanId) && html`<${PrepaymentForm} loan=${getLoan(modal.loanId)} onSave=${x => savePrepay(modal.loanId, x)} onClose=${() => setModal(null)} />`}
    ${modal && modal.type === 'loan' && html`<${LoanForm} loan=${modal.loan} isNew=${modal.isNew} landPrice=${data.property.totalCost} onSave=${saveLoan} onClose=${() => setModal(null)} />`}
    ${confirm && html`<${Modal} title=${confirm.title} onClose=${() => setConfirm(null)}
        footer=${html`<button className="btn" onClick=${() => setConfirm(null)}>Cancel</button>
          <button className=${'btn ' + (confirm.danger ? 'danger solid' : 'primary')} onClick=${() => { const run = confirm.run; setConfirm(null); run(); }}>${confirm.yes}</button>`}>
        <p>${confirm.text}</p>
      <//>`}
    ${toast && html`<div className="toast" role="status">${toast}</div>`}
  </div>`;
}

function readStored() { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; } }
function Root() {
  const [st, setSt] = useState(() => {
    const raw = readStored();
    if (raw && raw.enc) return { locked: true, blob: raw, n: 0 };
    let data = blank(); try { if (raw) data = normalize(raw); } catch (e) {}
    return { locked: false, data, lock: null, n: 0 };
  });
  const lockNow = () => { const blob = readStored(); if (!blob || !blob.enc) return; Drive.token = null; Drive.expires = 0; setSt(x => ({ locked: true, blob, n: x.n + 1 })); };
  if (st.locked && st.blob && st.blob.enc) return html`<${LockScreen} blob=${st.blob}
    onOpen=${(data, lock) => setSt(x => ({ locked: false, data, lock, n: x.n + 1 }))}
    onWipe=${() => { try { [STORE_KEY, STORE_KEY + ':exported', LINK_KEY].forEach(k => localStorage.removeItem(k)); } catch (e) {} setSt(x => ({ locked: false, data: blank(), lock: null, n: x.n + 1 })); }} />`;
  return html`<${App} key=${st.n} initial=${st.data || blank()} initialLock=${st.lock} onLock=${lockNow} />`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Root} />`);
</script>
</body>
</html>
