<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Land Ledger</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2F6B4F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFE7;--surface:#FAFBF7;--ink:#1C2620;--muted:#5A675F;--line:#D1D8CB;
  --accent:#2F6B4F;--accent-ink:#FFFFFF;--accent-soft:#DAE7DD;
  --ochre:#9A6B16;--ochre-soft:#F1E5C8;--danger:#A2392A;--danger-soft:#F5DDD7;
  --hatch:#B9C2B2;--shadow:0 1px 2px rgba(28,38,32,.06),0 8px 24px rgba(28,38,32,.06);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131915;--surface:#1A221D;--ink:#E3E9E2;--muted:#97A59C;--line:#2D3931;
    --accent:#72B592;--accent-ink:#0F1A14;--accent-soft:#213A2D;
    --ochre:#D8A94F;--ochre-soft:#3A301F;--danger:#E27E6B;--danger-soft:#3E2621;
    --hatch:#3A4840;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131915;--surface:#1A221D;--ink:#E3E9E2;--muted:#97A59C;--line:#2D3931;
  --accent:#72B592;--accent-ink:#0F1A14;--accent-soft:#213A2D;
  --ochre:#D8A94F;--ochre-soft:#3A301F;--danger:#E27E6B;--danger-soft:#3E2621;
  --hatch:#3A4840;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:20px 20px 64px}
h1,h2,h3{margin:0;line-height:1.2}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding:8px 0 20px;border-bottom:1px solid var(--line)}
.top h1{font-size:clamp(22px,3.2vw,30px);font-weight:800;letter-spacing:-.02em}
.top .sub{color:var(--muted);margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:var(--bg)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.notice{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--ochre-soft);color:var(--ink);font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* hero */
.hero{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:clamp(20px,5vw,56px);align-items:center;padding:32px 0 28px}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.plot{margin:0}
.plot svg{width:100%;height:auto;display:block}
.plot figcaption{margin-top:8px;color:var(--muted);font-size:14px}
.plot-unpaid{fill:url(#hatch)}
.hatch-line{stroke:var(--hatch);stroke-width:2}
.plot-paid{fill:var(--accent)}
.plot-edge{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:6 4;stroke-linejoin:round}
.stone{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.fill-rect{transition:y .7s ease,height .7s ease}
.level{stroke:var(--accent);stroke-width:1.2}
.plot-label{font-size:11px;fill:var(--muted);font-family:inherit}
@media (prefers-reduced-motion:reduce){.fill-rect{transition:none}}
.hero .lede{color:var(--muted);font-weight:600}
.hero .big{font-size:clamp(34px,6vw,54px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:4px}
.hero .of{margin-top:8px;font-size:16px;max-width:52ch}
.hero .of strong{color:var(--danger)}
.ledger{margin:22px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid var(--line)}
.ledger div{padding:12px 16px 12px 0;border-bottom:1px solid var(--line)}
.ledger dt{font-size:13px;color:var(--muted)}
.ledger dd{margin:2px 0 0;font-weight:700;font-size:18px}
.ledger dd small{font-weight:500;font-size:13px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-weight:500;color:var(--muted);margin-left:4px}
.panel{padding-top:24px}

.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:28px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.box + .box{margin-top:20px}
.box h2{font-size:17px;font-weight:700;margin-bottom:14px}
.box .hint{color:var(--muted);font-size:14px}

.bars{display:grid;gap:12px}
.bar-head{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.bar-head span:last-child{font-weight:600}
.track{height:8px;border-radius:4px;background:var(--bg);margin-top:5px;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.track i.extra{background:var(--ochre)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--accent);vertical-align:-1px}
.legend span.extra::before{background:var(--ochre)}

.kv{display:grid;gap:10px}
.kv div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.alert{padding:10px 12px;border-radius:8px;background:var(--danger-soft);font-size:14px;margin-bottom:14px}

.recent{list-style:none;margin:0;padding:0}
.recent li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.recent li:first-child{border-top:0;padding-top:0}
.recent .meta{color:var(--muted);font-size:13px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar .left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:first-child td{border-top:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.nowrap{white-space:nowrap}
td .meta{color:var(--muted);font-size:13px}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
tr.paid td{color:var(--muted)}
tr.overdue td:nth-child(3){color:var(--danger);font-weight:600}
.row-actions{display:flex;gap:2px;justify-content:flex-end}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.extra{background:var(--ochre-soft);color:var(--ochre)}
.check{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty p{max-width:44ch;margin:0 auto 14px}

/* forms */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.field{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.field.wide{grid-column:1/-1}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
.field textarea{min-height:80px;resize:vertical}
.field .help{font-weight:400}
.checkline{display:flex;gap:8px;align-items:flex-start;font-size:14px;grid-column:1/-1}
.checkline input{margin-top:3px}
.calc{grid-column:1/-1;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:14px}
select.filter{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

.overlay{position:fixed;inset:0;background:rgba(10,16,12,.45);display:grid;place-items:center;padding:16px;z-index:20;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);border-radius:14px;padding:22px;width:100%;max-width:560px;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:19px;margin-bottom:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.modal .err{color:var(--danger);font-size:14px;margin-top:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.danger-zone{margin-top:24px;border-color:var(--danger-soft)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* hero areas */
.hero{grid-template-areas:"plot head" "plot ledger";align-content:center}
.hero .plot{grid-area:plot}
.hero .headline{grid-area:head;align-self:end}
.hero .ledger{grid-area:ledger;align-self:start}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,260px) 1fr;grid-template-areas:"plot head" "ledger ledger"}}

/* card lists (phones) */
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;box-shadow:var(--shadow)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .meta{color:var(--muted);font-size:13px}
.card .row-actions{justify-content:flex-start;margin-left:-10px}
.card.paid{opacity:.72}
.card.overdue{border-color:var(--danger)}
.card.overdue .due{color:var(--danger);font-weight:600}
.emi-main{display:flex;gap:12px;align-items:center;cursor:pointer;min-width:0}
.emi-main .check{width:22px;height:22px;flex:none}
.card-total{display:flex;justify-content:space-between;padding:6px 2px;color:var(--muted);font-size:14px}
.card-total strong{color:var(--ink)}

/* drive sync */
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:0 4px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.sync i.warn{background:var(--ochre)}
.sync i.err{background:var(--danger)}
.notice.conflict{background:var(--danger-soft)}
.notice .btns{display:flex;gap:8px;flex-wrap:wrap}
.steps{margin:0 0 14px;padding-left:20px;color:var(--muted);font-size:14px}
.steps li{margin-bottom:4px}
code{font-size:13px;background:var(--bg);padding:1px 5px;border-radius:4px}

@media (max-width:640px){
  .wrap{padding:12px 14px 48px}
  .top{flex-direction:column;align-items:stretch;gap:12px;padding:4px 0 14px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .actions .btn{justify-content:center;padding:10px 12px}
  .actions .full{grid-column:1/-1}
  .actions .sync{grid-column:1/-1;justify-content:center}
  .hero{grid-template-columns:96px 1fr;gap:10px 16px;padding:18px 0 20px}
  .plot figcaption{font-size:12px;margin-top:4px}
  .hero .big{font-size:30px}
  .hero .of{font-size:14px}
  .hero .of .btn{margin-top:6px}
  .ledger{grid-template-columns:1fr 1fr;margin-top:6px}
  .ledger div{padding:10px 10px 10px 0}
  .ledger dd{font-size:16px}
  .tab{padding:10px 12px}
  .panel{padding-top:16px}
  .box{padding:16px;border-radius:12px}
  .box + .box{margin-top:14px}
  .cols{gap:14px}
  .toolbar .btn.primary{flex:1;justify-content:center}
  .field input,.field select,.field textarea,select.filter{font-size:16px}
  select.filter{width:100%}
  .toolbar .left{flex:1}
  .overlay{align-items:end;padding:0}
  .modal{border-radius:16px 16px 0 0;max-height:92vh;padding:18px 16px 0}
  .modal .foot{position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:12px}
  .modal .foot .btn{flex:1;justify-content:center;padding:11px}
  .row-actions .btn.small{padding:8px 10px}
  .notice{font-size:13px}
}
.lock-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
.lock{max-width:380px;width:100%;display:grid;gap:14px}
.lock svg{width:64px;height:auto}
.lock h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.lock .err{color:var(--danger);font-size:14px}
.lock .btn{justify-content:center;padding:11px}
.pw-fields{display:grid;gap:12px;max-width:360px;margin-bottom:14px}
.pw-fields .err{color:var(--danger);font-size:14px}
.toward{display:flex;gap:10px;align-items:flex-start;grid-column:1/-1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.toward.on{border-color:var(--accent);background:var(--accent-soft)}
.toward input{margin-top:2px;flex:none}
.toward strong{display:block;font-size:14px}
.toward span{font-size:13px;color:var(--muted)}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg);margin:4px 0 14px}
.split i{display:block;height:100%}
.split .s-loan{background:var(--ochre)}
.split .s-paid{background:var(--accent)}
.legend span.loan::before{background:var(--ochre)}
.legend span.due::before{background:var(--line)}
.calc.warn{background:var(--danger-soft)}
.loan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.loan-card{display:grid;gap:4px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;box-shadow:var(--shadow);font:inherit;color:inherit}
.loan-card:hover{border-color:var(--muted)}
.loan-card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.loan-card .lc-amt{font-weight:700;font-size:18px;margin-top:4px}
.loan-card .lc-amt small{font-weight:500;font-size:13px;color:var(--muted)}
.loan-card .meta{color:var(--muted);font-size:13px}
.loan-card.add{align-content:center;justify-items:center;border-style:dashed;color:var(--muted);font-weight:600;min-height:120px;box-shadow:none}
.pill.plain{background:var(--bg);color:var(--muted)}
@media (max-width:640px){
  .loan-grid{grid-auto-flow:column;grid-auto-columns:78%;grid-template-columns:none;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
  .loan-card{scroll-snap-align:start}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);
const STORE_KEY = 'land-ledger:v1';

/* ---------- data model ---------- */
const CATS = [
  { id: 'booking', label: 'Booking advance', price: true },
  { id: 'seller', label: 'Payment to seller', price: true },
  { id: 'legal', label: 'Legal verification' },
  { id: 'registration', label: 'Registration & stamp duty' },
  { id: 'documents', label: 'EC, patta & documents' },
  { id: 'survey', label: 'Survey & measurement' },
  { id: 'broker', label: 'Broker commission' },
  { id: 'loanfees', label: 'Loan processing fees' },
  { id: 'development', label: 'Fencing & development' },
  { id: 'other', label: 'Other' },
];
const catById = Object.fromEntries(CATS.map(c => [c.id, c]));
const MODES = ['Bank transfer', 'UPI', 'Cheque', 'Demand draft', 'Cash', 'Card'];
const UNITS = ['cents', 'sq ft', 'acres', 'grounds', 'sq m', 'hectares'];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
function addMonths(iso, i) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const first = new Date(y, m - 1 + i, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return first.getFullYear() + '-' + pad(first.getMonth() + 1) + '-' + pad(Math.min(d, last));
}
const inr = n => '₹' + num(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const fdate = iso => {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-').map(Number);
  if (!y || !m || !d) return iso;
  return new Date(y, m - 1, d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
};

const LOAN_TYPES = [
  { id: 'land', label: 'Land loan', repay: 'emi', use: 'seller' },
  { id: 'personal', label: 'Personal loan', repay: 'emi', use: 'self' },
  { id: 'gold', label: 'Gold loan', repay: 'bullet', use: 'self' },
  { id: 'other', label: 'Other loan', repay: 'emi', use: 'self' },
];
const loanTypeById = Object.fromEntries(LOAN_TYPES.map(t => [t.id, t]));
const REPAY = [
  { id: 'emi', label: 'EMI every month', short: 'Monthly EMI', due: 'First EMI date' },
  { id: 'interest', label: 'Interest every month, principal at the end', short: 'Monthly interest, principal at end', due: 'First interest due date' },
  { id: 'bullet', label: 'Everything at the end (bullet)', short: 'Bullet repayment at end', due: 'Repayment due date' },
];
const repayById = Object.fromEntries(REPAY.map(r => [r.id, r]));
const PURITY = ['24K', '22K', '20K', '18K', 'Other'];
const loanName = l => l.name || loanTypeById[l.type].label;

const blankLoan = (type = 'land') => ({
  id: uid(), type, name: loanTypeById[type].label, lender: '', accountNo: '',
  principal: '', rate: '', tenureMonths: '', emi: '', loanDate: '', startDate: '',
  repayment: loanTypeById[type].repay, use: loanTypeById[type].use,
  gold: { weight: '', purity: '22K', ratePerGram: '', pledgeNo: '' },
  notes: '', prepayments: [], emis: [],
});

const blank = () => ({
  app: 'land-ledger', version: 2, updatedAt: null,
  property: { name: '', location: '', surveyNo: '', area: '', areaUnit: 'cents', totalCost: '', seller: '', agreementDate: '', notes: '' },
  loans: [], payments: [],
});

const normPre = arr => (Array.isArray(arr) ? arr : []).map(x => ({
  id: x.id || uid(), date: x.date || '', amount: num(x.amount), mode: x.mode === 'emi' ? 'emi' : 'tenure', note: x.note || '' }));
const normEmis = arr => (Array.isArray(arr) ? arr : []).map((e, i) => ({
  id: e.id || uid(), no: e.no || i + 1, dueDate: e.dueDate || '', amount: num(e.amount),
  principal: num(e.principal), interest: num(e.interest), balance: num(e.balance),
  status: e.status === 'paid' ? 'paid' : 'pending', paidDate: e.paidDate || '', note: e.note || '' }));
function normLoan(l) {
  const t = loanTypeById[l.type] ? l.type : 'other';
  const b = blankLoan(t);
  return {
    ...b, ...l, id: l.id || b.id, type: t,
    repayment: repayById[l.repayment] ? l.repayment : b.repayment,
    use: l.use === 'seller' || l.use === 'self' ? l.use : b.use,
    gold: { ...b.gold, ...(l.gold || {}) },
    prepayments: normPre(l.prepayments), emis: normEmis(l.emis),
  };
}

function normalize(raw) {
  if (!raw || typeof raw !== 'object' || (!raw.property && !Array.isArray(raw.payments)))
    throw new Error('This file is not a Land Ledger JSON export.');
  const b = blank();
  let loans = Array.isArray(raw.loans) ? raw.loans.map(normLoan) : [];
  // version 1 files had a single "loan" plus a top-level "emis" list
  if (!Array.isArray(raw.loans)) {
    const l = raw.loan || {};
    const oldEmis = Array.isArray(raw.emis) ? raw.emis : [];
    if (l.enabled || oldEmis.length) loans = [normLoan({
      ...l, id: uid(), type: l.enabled ? 'land' : 'other', name: l.enabled ? 'Land loan' : 'Loan',
      repayment: 'emi', use: l.enabled && l.paidToSeller !== false ? 'seller' : 'self', emis: oldEmis })];
  }
  const { loan, emis, ...rest } = raw;
  return {
    ...b, ...rest, version: 2,
    property: { ...b.property, ...(raw.property || {}) },
    loans,
    payments: (Array.isArray(raw.payments) ? raw.payments : []).map(p => ({
      id: p.id || uid(), date: p.date || '', category: catById[p.category] ? p.category : 'other',
      description: p.description || '', paidTo: p.paidTo || '', mode: p.mode || '', reference: p.reference || '',
      amount: num(p.amount),
      towardPrice: typeof p.towardPrice === 'boolean' ? p.towardPrice : !!(catById[p.category] && catById[p.category].price),
    })),
  };
}

function calcEmi(P, rate, n) {
  P = num(P); n = Math.round(num(n)); const r = num(rate) / 1200;
  if (!P || !n) return 0;
  if (!r) return r2(P / n);
  const f = Math.pow(1 + r, n);
  return r2(P * r * f / (f - 1));
}

function buildSchedule(loan, old) {
  const P = num(loan.principal), n = Math.round(num(loan.tenureMonths)), r = num(loan.rate) / 1200;
  const kind = loan.repayment || 'emi';
  if (!P || !n || !loan.startDate) throw new Error('Enter the loan amount, tenure and ' + repayById[kind].due.toLowerCase() + ' to create the schedule.');
  let emi = kind === 'emi' ? (num(loan.emi) || calcEmi(P, loan.rate, n)) : 0;
  if (kind === 'emi' && emi <= r2(P * r)) throw new Error('The EMI is too low to cover the monthly interest. Check the EMI amount or leave it blank to calculate it.');
  const pre = [...(loan.prepayments || [])].filter(x => x.date && num(x.amount) > 0).sort((a, b) => (a.date > b.date ? 1 : -1));
  let bal = P, pi = 0;
  const applyPre = (before, i) => {
    while (pi < pre.length && pre[pi].date < before) {
      bal = Math.max(0, r2(bal - num(pre[pi].amount)));
      if (kind === 'emi' && pre[pi].mode === 'emi' && bal > 0) emi = calcEmi(bal, loan.rate, Math.max(1, n - i));
      pi++;
    }
  };
  const keep = (prev, row) => {
    const paid = prev && prev.status === 'paid';
    return { ...row, id: prev ? prev.id : uid(), status: paid ? 'paid' : 'pending', paidDate: paid ? prev.paidDate : '', note: prev ? prev.note : '' };
  };

  if (kind === 'bullet') {
    // interest builds up month by month on the balance; everything is paid on the due date
    let accrued = 0;
    for (let i = 0; i < n; i++) { applyPre(addMonths(loan.startDate, i - (n - 1)), i); accrued = r2(accrued + bal * r); }
    if (bal <= 0.005 && accrued <= 0.005) return [];
    const prev = old[0];
    const paidAmt = prev && prev.status === 'paid' && num(prev.amount) > 0;
    return [keep(prev, { no: 1, dueDate: loan.startDate, amount: paidAmt ? num(prev.amount) : r2(bal + accrued), principal: bal, interest: paidAmt ? num(prev.interest) : accrued, balance: 0 })];
  }

  const rows = [];
  for (let i = 0; bal > 0.005 && i < n + 600; i++) {
    const due = addMonths(loan.startDate, i);
    applyPre(due, i);
    if (bal <= 0.005) break;
    const prev = old[i];
    let interest, principal, amount;
    if (prev && prev.status === 'paid' && num(prev.amount) > 0) {
      interest = num(prev.interest); principal = Math.min(bal, num(prev.principal)); amount = num(prev.amount);
    } else if (kind === 'interest') {
      interest = r2(bal * r); principal = i >= n - 1 ? r2(bal) : 0; amount = r2(interest + principal);
    } else {
      interest = r2(bal * r); principal = r2(emi - interest); amount = emi;
      if (i >= n - 1 || principal >= bal) { principal = r2(bal); amount = r2(principal + interest); }
    }
    bal = Math.max(0, r2(bal - principal));
    rows.push(keep(prev, { no: i + 1, dueDate: due, amount, principal, interest, balance: bal }));
    if (kind === 'interest' && i >= n - 1) break;
  }
  return rows;
}

function scheduleStats(rows) {
  const pending = rows.filter(e => e.status !== 'paid');
  return { interest: rows.reduce((a, e) => a + num(e.interest), 0), months: rows.length, end: rows.length ? rows[rows.length - 1].dueDate : '', emi: pending.length ? pending[0].amount : 0 };
}

function loanStats(l, today) {
  const paid = l.emis.filter(e => e.status === 'paid');
  const pending = l.emis.filter(e => e.status !== 'paid').sort((a, b) => (a.dueDate > b.dueDate ? 1 : -1));
  const principalPaid = paid.reduce((a, e) => a + num(e.principal), 0);
  const prepaid = l.prepayments.reduce((a, x) => a + num(x.amount), 0);
  const P = num(l.principal);
  const sorted = [...l.emis].sort((a, b) => (a.dueDate > b.dueDate ? 1 : -1));
  return {
    loan: l,
    paidCount: paid.length, count: l.emis.length,
    paidAmt: paid.reduce((a, e) => a + num(e.amount), 0),
    principalPaid, prepaid,
    interestPaid: paid.reduce((a, e) => a + num(e.interest), 0),
    scheduledInterest: l.emis.reduce((a, e) => a + num(e.interest), 0),
    outstanding: P > 0 ? Math.max(0, P - principalPaid - prepaid) : pending.reduce((a, e) => a + num(e.principal), 0),
    overdue: pending.filter(e => e.dueDate && e.dueDate < today),
    next: pending.find(e => !e.dueDate || e.dueDate >= today) || null,
    end: sorted.length ? sorted[sorted.length - 1].dueDate : '',
    goldValue: num(l.gold && l.gold.weight) * num(l.gold && l.gold.ratePerGram),
  };
}

function summarize(data) {
  const byCat = {}; CATS.forEach(c => byCat[c.id] = 0);
  let totalPayments = 0;
  const byCatToward = {}; CATS.forEach(c => byCatToward[c.id] = 0);
  data.payments.forEach(p => {
    byCat[p.category] = (byCat[p.category] || 0) + num(p.amount); totalPayments += num(p.amount);
    if (p.towardPrice) byCatToward[p.category] = (byCatToward[p.category] || 0) + num(p.amount);
  });
  const towardDirect = data.payments.filter(p => p.towardPrice).reduce((a, p) => a + num(p.amount), 0);
  const additional = totalPayments - towardDirect;
  const today = todayISO();
  const ls = data.loans.map(l => loanStats(l, today));
  const sum = (arr, k) => arr.reduce((a, x) => a + num(x[k]), 0);
  const loanToSeller = data.loans.filter(l => l.use === 'seller').reduce((a, l) => a + num(l.principal), 0);
  const loanToSelf = data.loans.filter(l => l.use !== 'seller').reduce((a, l) => a + num(l.principal), 0);
  const towardPrice = towardDirect + loanToSeller;
  const totalCost = num(data.property.totalCost);
  const emiPaid = sum(ls, 'paidAmt'), prepaid = sum(ls, 'prepaid'), scheduledInterest = sum(ls, 'scheduledInterest');
  const overdue = ls.flatMap(x => x.overdue.map(e => ({ ...e, loan: x.loan })));
  const nexts = ls.filter(x => x.next).map(x => ({ ...x.next, loan: x.loan })).sort((a, b) => (a.dueDate > b.dueDate ? 1 : -1));
  return {
    byCat, byCatToward, totalPayments, towardDirect, additional, loanToSeller, loanToSelf, towardPrice, totalCost,
    balance: Math.max(0, totalCost - towardPrice),
    loanStats: ls, borrowed: loanToSeller + loanToSelf,
    emiPaid, prepaid, emiPaidCount: sum(ls, 'paidCount'), emiCount: sum(ls, 'count'),
    principalPaid: sum(ls, 'principalPaid'), interestPaid: sum(ls, 'interestPaid'), scheduledInterest,
    loanOutstanding: sum(ls, 'outstanding'),
    pocket: Math.max(0, totalPayments + emiPaid + prepaid - loanToSelf),
    overdue, next: nexts[0] || null,
    projected: totalCost + additional + scheduledInterest,
    pct: totalCost > 0 ? Math.min(1, towardPrice / totalCost) : 0,
    ownShare: Math.max(0, totalCost - loanToSeller),
    ownRemaining: Math.max(0, totalCost - loanToSeller - towardDirect),
    overpaid: totalCost > 0 ? Math.max(0, towardPrice - totalCost) : 0,
    loanPct: totalCost > 0 ? loanToSeller / totalCost : 0,
  };
}

/* ---------- files ---------- */
const downloadsReady = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);

async function offerFile(filename, data, mime) {
  const dl = await downloadsReady;
  if (dl) {
    try { await dl.save({ filename, data }); return 'saved'; }
    catch (e) {
      if (e && e.code === 'declined') return 'declined';
      if (e && e.code === 'rate_limited') throw new Error('A save prompt is already open. Finish that one first.');
      if (!e || !['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code))
        throw new Error((e && e.message) || 'The file could not be saved.');
    }
  }
  const blob = new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return 'saved';
}

const slug = s => (s || 'land').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'land';
const serial = iso => {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  if (!y) return iso;
  return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000;
};

function formatSheet(ws, { money = [], dates = [], widths = [] }) {
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let R = range.s.r; R <= range.e.r; R++) {
    for (let C = range.s.c; C <= range.e.c; C++) {
      const cell = ws[XLSX.utils.encode_cell({ r: R, c: C })];
      if (!cell || cell.t !== 'n') continue;
      if (money.includes(C)) cell.z = '#,##0.00';
      if (dates.includes(C)) cell.z = 'dd-mmm-yyyy';
    }
  }
  ws['!cols'] = widths.map(w => ({ wch: w }));
}

function buildWorkbook(data, s) {
  const P = data.property;
  const wb = XLSX.utils.book_new();
  const usedNames = new Set();
  const sheetName = base => {
    let n = String(base).replace(/[\\\/\?\*\[\]:]/g, ' ').trim().slice(0, 28) || 'Sheet';
    let k = n, i = 2;
    while (usedNames.has(k.toLowerCase())) k = n.slice(0, 25) + ' ' + i++;
    usedNames.add(k.toLowerCase()); return k;
  };

  const summary = [
    ['Land purchase summary'],
    ['Generated on', fdate(todayISO())],
    [],
    ['Property', P.name], ['Location', P.location], ['Survey number', P.surveyNo],
    ['Area', P.area ? P.area + ' ' + P.areaUnit : ''], ['Seller', P.seller], ['Agreement date', P.agreementDate ? fdate(P.agreementDate) : ''],
    [],
    ['Agreed land price (₹)', s.totalCost],
    ['Paid toward land price (₹)', s.towardPrice],
    ['   Paid by you (₹)', s.towardDirect],
    ['   Paid by loans to the seller (₹)', s.loanToSeller],
    ['Balance due to seller (₹)', s.balance],
    ['Additional costs (₹)', s.additional],
    [],
    ['Loans'],
    ['Total borrowed (₹)', s.borrowed],
    ['   Paid directly to the seller (₹)', s.loanToSeller],
    ['   Received in your account (₹)', s.loanToSelf],
    ['Loan payments made', s.emiPaidCount + ' of ' + s.emiCount],
    ['Paid in EMIs and dues (₹)', s.emiPaid],
    ['   Principal repaid (₹)', s.principalPaid],
    ['   Interest paid (₹)', s.interestPaid],
    ['Part payments (₹)', s.prepaid],
    ['Total outstanding (₹)', s.loanOutstanding],
    ['Total interest over all loans (₹)', s.scheduledInterest],
    [],
    ['Your own money spent (₹)', s.pocket],
    ['Projected total cost incl. interest (₹)', s.projected],
    [],
    ['Spending by category', 'Total (₹)', 'Toward land price (₹)'],
    ...CATS.map(c => [c.label, s.byCat[c.id], s.byCatToward[c.id]]),
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(summary);
  formatSheet(ws1, { money: [1, 2], widths: [40, 22, 24] });
  XLSX.utils.book_append_sheet(wb, ws1, sheetName('Summary'));

  // one row per loan
  const loanHead = ['Loan', 'Type', 'Lender', 'Loan / account no.', 'Amount (₹)', 'Interest % p.a.', 'Repayment', 'Tenure (months)', 'Loan date', 'First / due date',
    'Money went to', 'Next due (₹)', 'Next due date', 'Paid so far (₹)', 'Interest paid (₹)', 'Part payments (₹)', 'Outstanding (₹)', 'Total interest (₹)', 'Ends',
    'Gold weight (g)', 'Purity', 'Gold rate per g (₹)', 'Gold value (₹)', 'Loan to value %', 'Pledge / receipt no.'];
  const loanRows = [loanHead];
  s.loanStats.forEach(x => {
    const l = x.loan, g = l.gold || {}, isGold = l.type === 'gold';
    loanRows.push([loanName(l), loanTypeById[l.type].label, l.lender, l.accountNo, num(l.principal), num(l.rate), repayById[l.repayment].short,
      Math.round(num(l.tenureMonths)) || '', serial(l.loanDate), serial(l.startDate),
      l.use === 'seller' ? 'Seller (counts toward land price)' : 'My account',
      x.next ? num(x.next.amount) : 0, x.next ? serial(x.next.dueDate) : '', x.paidAmt, x.interestPaid, x.prepaid, x.outstanding, x.scheduledInterest, serial(x.end),
      isGold ? num(g.weight) || '' : '', isGold ? g.purity : '', isGold ? num(g.ratePerGram) || '' : '', isGold && x.goldValue ? x.goldValue : '',
      isGold && x.goldValue ? Math.round(num(l.principal) / x.goldValue * 1000) / 10 : '', isGold ? g.pledgeNo : '']);
  });
  if (s.loanStats.length > 1) loanRows.push([], ['Total', '', '', '', s.borrowed, '', '', '', '', '', '', '', '', s.emiPaid, s.interestPaid, s.prepaid, s.loanOutstanding, s.scheduledInterest]);
  const ws2 = XLSX.utils.aoa_to_sheet(loanRows);
  formatSheet(ws2, { money: [4, 11, 13, 14, 15, 16, 17, 21, 22], dates: [8, 9, 12, 18], widths: [20, 14, 20, 18, 14, 10, 26, 10, 13, 13, 26, 13, 13, 14, 14, 14, 14, 14, 13, 10, 8, 12, 14, 10, 18] });
  XLSX.utils.book_append_sheet(wb, ws2, sheetName('Loans'));

  const pays = [...data.payments].sort((a, b) => (a.date > b.date ? 1 : -1));
  const payRows = [['Date', 'Category', 'Description', 'Paid to', 'Mode', 'Reference', 'Amount (₹)', 'Counts toward land price']];
  pays.forEach(p => payRows.push([serial(p.date), catById[p.category].label, p.description, p.paidTo, p.mode, p.reference, num(p.amount), p.towardPrice ? 'Yes' : 'No']));
  payRows.push([], ['', '', '', '', '', 'Total', s.totalPayments, '']);
  const ws3 = XLSX.utils.aoa_to_sheet(payRows);
  formatSheet(ws3, { money: [6], dates: [0], widths: [13, 26, 34, 22, 15, 18, 16, 22] });
  XLSX.utils.book_append_sheet(wb, ws3, sheetName('Payments'));

  // a schedule sheet for every loan
  s.loanStats.forEach(x => {
    const l = x.loan;
    const rows = [[loanName(l) + (l.lender ? ', ' + l.lender : '')], [repayById[l.repayment].short + ', ' + num(l.rate) + '% p.a.'], [],
      ['No.', 'Due date', 'Amount (₹)', 'Principal (₹)', 'Interest (₹)', 'Balance after (₹)', 'Status', 'Paid on', 'Note']];
    [...l.emis].sort((a, b) => (a.dueDate > b.dueDate ? 1 : -1)).forEach(e =>
      rows.push([e.no, serial(e.dueDate), num(e.amount), num(e.principal), num(e.interest), num(e.balance), e.status === 'paid' ? 'Paid' : 'Pending', serial(e.paidDate), e.note]));
    const tot = k => l.emis.reduce((a, e) => a + num(e[k]), 0);
    rows.push([], ['Total', '', tot('amount'), tot('principal'), tot('interest'), '', x.paidCount + ' paid', '', '']);
    const ws = XLSX.utils.aoa_to_sheet(rows);
    formatSheet(ws, { money: [2, 3, 4, 5], dates: [1, 7], widths: [8, 13, 14, 14, 14, 17, 10, 13, 28] });
    XLSX.utils.book_append_sheet(wb, ws, sheetName(loanName(l)));
  });

  const pre = data.loans.flatMap(l => l.prepayments.map(p => ({ ...p, loan: l }))).sort((a, b) => (a.date > b.date ? 1 : -1));
  if (pre.length) {
    const preRows = [['Date', 'Loan', 'Amount (₹)', 'Used to', 'Note']];
    pre.forEach(p => preRows.push([serial(p.date), loanName(p.loan), num(p.amount), p.loan.repayment !== 'emi' ? 'Reduce principal' : p.mode === 'emi' ? 'Reduce EMI' : 'Reduce tenure', p.note]));
    preRows.push([], ['Total', '', s.prepaid, '', '']);
    const ws4 = XLSX.utils.aoa_to_sheet(preRows);
    formatSheet(ws4, { money: [2], dates: [0], widths: [13, 22, 16, 16, 30] });
    XLSX.utils.book_append_sheet(wb, ws4, sheetName('Part payments'));
  }

  return XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
}

/* ---------- Google Drive sync (optional) ----------
   The client ID comes from the GOOGLE_CLIENT_ID repository variable, injected
   by .github/workflows/deploy.yml (see README). It is a public identifier, not a secret. */
const GOOGLE_CLIENT_ID = (() => {
  const v = '__GOOGLE_CLIENT_ID__'; // replaced at deploy time by the GitHub Actions workflow
  return /^__[A-Z_]+__$/.test(v) ? '' : v.trim();
})();
const DRIVE_FILE_NAME = 'land-ledger.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const LINK_KEY = STORE_KEY + ':drive';

const Drive = {
  ready: null, token: null, expires: 0,
  load() {
    if (!GOOGLE_CLIENT_ID) return Promise.resolve(false);
    if (this.ready) return this.ready;
    this.ready = new Promise(res => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => res(!!(window.google && google.accounts && google.accounts.oauth2));
      s.onerror = () => res(false);
      document.head.appendChild(s);
      setTimeout(() => res(false), 10000);
    });
    return this.ready;
  },
  hasToken() { return !!this.token && Date.now() < this.expires - 60000; },
  signIn() {
    return new Promise((resolve, reject) => {
      if (this.hasToken()) return resolve(this.token);
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE,
        callback: r => {
          if (r.error) return reject(new Error('Google sign-in failed (' + r.error + ').'));
          this.token = r.access_token; this.expires = Date.now() + (r.expires_in || 3600) * 1000; resolve(this.token);
        },
        error_callback: e => reject(new Error(e && e.type === 'popup_closed' ? 'The Google sign-in window was closed.' : 'Google sign-in was blocked. Allow pop-ups for this site and try again.')),
      });
      client.requestAccessToken({ prompt: '' });
    });
  },
  signOut() { if (this.token && window.google) google.accounts.oauth2.revoke(this.token, () => {}); this.token = null; this.expires = 0; },
  async api(url, opts = {}) {
    const expired = () => { const e = new Error('Drive session expired. Tap Sync with Drive to reconnect.'); e.code = 'auth'; return e; };
    if (!this.hasToken()) throw expired();
    const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + this.token } });
    if (r.status === 401) { this.token = null; throw expired(); }
    if (!r.ok) { const e = new Error('Google Drive returned an error (' + r.status + ').'); e.status = r.status; throw e; }
    return r;
  },
  async find() {
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const j = await (await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime desc&fields=files(id,modifiedTime)`)).json();
    return (j.files && j.files[0]) || null;
  },
  async meta(id) { return (await this.api(`https://www.googleapis.com/drive/v3/files/${id}?fields=id,modifiedTime,trashed`)).json(); },
  async read(id) { return (await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); },
  async create(data) {
    const b = 'll' + uid();
    const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: 'application/json' })}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(data, null, 2)}\r\n--${b}--`;
    return (await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime',
      { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body })).json();
  },
  async write(id, data) {
    return (await this.api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media&fields=id,modifiedTime`,
      { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data, null, 2) })).json();
  },
};

/* ---------- app lock: passphrase + AES-GCM encryption of this device's copy ---------- */
const CRYPTO_OK = !!(window.crypto && window.crypto.subtle && window.isSecureContext !== false);
const LOCK_AFTER_MS = 10 * 60 * 1000;
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function makeLock(pass) { const salt = crypto.getRandomValues(new Uint8Array(16)); return { key: await deriveKey(pass, salt), salt: b64(salt) }; }
async function sealData(lock, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, lock.key, te.encode(JSON.stringify(obj)));
  return { enc: 1, alg: 'AES-GCM/PBKDF2-SHA256-310k', salt: lock.salt, iv: b64(iv), ct: b64(ct) };
}
async function openData(pass, blob) {
  const key = await deriveKey(pass, unb64(blob.salt));
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.iv) }, key, unb64(blob.ct));
  return { data: normalize(JSON.parse(td.decode(pt))), lock: { key, salt: blob.salt } };
}
async function checkPass(pass) {
  try { const blob = JSON.parse(localStorage.getItem(STORE_KEY)); if (!blob || !blob.enc) return false; await openData(pass, blob); return true; }
  catch (e) { return false; }
}

function LockScreen({ blob, onOpen, onWipe }) {
  const [pass, setPass] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [forgot, setForgot] = useState(false);
  const open = async () => {
    if (!pass || busy) return;
    setBusy(true); setErr('');
    try { const r = await openData(pass, blob); onOpen(r.data, r.lock); }
    catch (e) { setErr('That passphrase is not correct.'); setBusy(false); }
  };
  return html`<div className="lock-wrap"><div className="lock box">
    <svg viewBox="0 0 240 204" aria-hidden="true"><polygon points=${PTS} className="plot-edge" />${PLOT.map(([x, y], i) => html`<rect key=${i} className="stone" x=${x - 5} y=${y - 5} width="10" height="10" />`)}</svg>
    <h1>Land Ledger is locked</h1>
    <p className="hint">Enter your passphrase to open it.</p>
    <label className="field">Passphrase

      : html`<div className="notice conflict"><span>A forgotten passphrase can't be recovered. You can clear this device, then load your data again from Google Drive or an exported JSON file.</span>
          <div className="btns"><button className="btn small" onClick=${() => setForgot(false)}>Cancel</button><button className="btn small danger solid" onClick=${onWipe}>Clear this device</button></div></div>`}
  </div></div>`;
}

function LockSettings({ lock, onEnable, onDisable, onLockNow }) {
  const [mode, setMode] = useState(null);
  const [cur, setCur] = useState(''), [a, setA] = useState(''), [b, setB] = useState('');
  const [err, setErr] = useState(''), [busy, setBusy] = useState(false);
  const close = () => { setMode(null); setCur(''); setA(''); setB(''); setErr(''); };
  const submit = async () => {
    setErr('');
    if (mode !== 'off') {
      if (a.length < 6) return setErr('Use at least 6 characters.');
      if (a !== b) return setErr("The two passphrases don't match.");
    }
    setBusy(true);
    try {
      if (mode !== 'set' && !(await checkPass(cur))) return setErr('The current passphrase is not correct.');
      if (mode === 'off') await onDisable(); else await onEnable(a);
      close();
    } finally { setBusy(false); }
  };
  if (!CRYPTO_OK) return html`<section className="box"><h2>App lock</h2><p className="hint">App lock needs the app to be opened over https, such as from GitHub Pages.</p></section>`;
  return html`<section className="box">
    <h2>App lock</h2>
    <p className="hint" style=${{ marginBottom: '14px' }}>${lock
      ? 'On. The app locks after 10 minutes without use, and the copy saved on this device is encrypted with your passphrase.'
      : 'Off. Anyone who opens this app on this device and browser can see your data. Set a passphrase to lock the app and encrypt the copy saved here.'}</p>
    ${mode ? html`<div className="pw-fields">
        ${mode !== 'set' && html`<label className="field">Current passphrase<input type="password" autoComplete="current-password" value=${cur} onChange=${e => setCur(e.target.value)} /></label>`}
        ${mode !== 'off' && html`<label className="field">New passphrase<input type="password" autoComplete="new-password" value=${a} onChange=${e => setA(e.target.value)} /></label>`}
        ${mode !== 'off' && html`<label className="field">Type it again<input type="password" autoComplete="new-password" value=${b} onChange=${e => setB(e.target.value)} /></label>`}
        ${mode !== 'off' && html`<span className="hint" style=${{ fontSize: '13px' }}>There is no reset. If you forget it, you'll need your Drive file or a JSON export to get your data back.</span>`}
        ${err && html`<p className="err" role="alert">${err}</p>`}
        <div className="actions">
          <button className="btn" onClick=${close}>Cancel</button>
          <button className=${'btn ' + (mode === 'off' ? 'danger' : 'primary')} onClick=${submit} disabled=${busy}>${busy ? 'Working…' : mode === 'set' ? 'Turn on app lock' : mode === 'change' ? 'Change passphrase' : 'Turn off app lock'}</button>
        </div>
      </div>`
      : html`<div className="actions">${lock
        ? html`<button className="btn primary" onClick=${onLockNow}>Lock now</button><button className="btn" onClick=${() => setMode('change')}>Change passphrase</button><button className="btn quiet danger" onClick=${() => setMode('off')}>Turn off app lock</button>`
        : html`<button className="btn primary full" onClick=${() => setMode('set')}>Set a passphrase</button>`}</div>`}
  </section>`;
}

function useIsMobile() {
  const q = '(max-width: 640px)';
  const [m, setM] = useState(() => window.matchMedia(q).matches);
  useEffect(() => {
    const mq = window.matchMedia(q), f = e => setM(e.matches);
    mq.addEventListener('change', f); return () => mq.removeEventListener('change', f);
  }, []);
  return m;
}

function PrepaymentForm({ loan, onSave, onClose }) {
  const isEmi = loan.repayment === 'emi';
  const [f, setF] = useState({ date: todayISO(), amount: '', mode: 'tenure', note: '' });
  const [err, setErr] = useState('');
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const old = useMemo(() => [...loan.emis].sort((a, b) => a.no - b.no), [loan]);
  const base = useMemo(() => { try { return scheduleStats(buildSchedule(loan, old)); } catch (e) { return null; } }, [loan, old]);
  const sim = mode => {
    if (!(num(f.amount) > 0) || !f.date) return null;
    try {
      const rows = buildSchedule({ ...loan, prepayments: [...loan.prepayments, { ...f, mode, amount: num(f.amount) }] }, old);
      const next = rows.find(e => e.status !== 'paid' && e.dueDate > f.date);
      return { ...scheduleStats(rows), nextEmi: next ? next.amount : 0 };
    } catch (e) { return null; }
  };
  const a = isEmi ? sim('emi') : null, b = sim('tenure');
  const nx = old.find(e => e.status !== 'paid' && e.dueDate > f.date);
  const curEmi = nx ? nx.amount : 0;
  const monthsBetween = (x, y) => { if (!x || !y) return 0; const [y1, m1] = x.split('-').map(Number), [y2, m2] = y.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
  const saved = r => (base && r ? Math.max(0, base.interest - r.interest) : 0);
  const save = () => {
    if (!f.date) return setErr('Enter the date of the part payment.');
    if (!(num(f.amount) > 0)) return setErr('Enter the amount you paid.');
    onSave({ ...f, id: uid(), amount: num(f.amount) });
  };
  const opt = (mode, r, title) => html`<label className=${'toward' + (f.mode === mode ? ' on' : '')}>
      <input type="radio" name="ppmode" className="check" checked=${f.mode === mode} onChange=${() => setF({ ...f, mode })} />
      <span><strong>${title}</strong>${!r ? 'Enter the amount and date to see the effect.'
        : mode === 'emi'
          ? `EMI goes from ${inr(curEmi)} to ${inr(r.nextEmi)}. Loan still ends ${fdate(r.end)}. Interest saved: ${inr(saved(r))}.`
          : `EMI stays ${inr(curEmi)}. Loan ends ${fdate(r.end)}, ${Math.max(0, monthsBetween(r.end, base ? base.end : r.end))} months earlier. Interest saved: ${inr(saved(r))}.`}</span>
    </label>`;
  const better = a && b ? saved(b) - saved(a) : 0;
  return html`<${Modal} title=${'Part payment: ' + loanName(loan)} onClose=${onClose}
      footer=${html`<button className="btn" onClick=${onClose}>Cancel</button><button className="btn primary" onClick=${save}>Save part payment</button>`}>
    <div className="fields">
      <${Field} label="Date paid"><input type="date" value=${f.date} onChange=${set('date')} /><//>
      <${Field} label="Amount (₹)"><input type="number" min="0" step="any" inputMode="decimal" value=${f.amount} onChange=${set('amount')} autoFocus /><//>
      ${isEmi ? html`
        <p className="field wide" style=${{ margin: 0 }}>What did you ask the bank to reduce?</p>
        ${opt('tenure', b, 'Reduce tenure (keep the same EMI)')}
        ${opt('emi', a, 'Reduce EMI (keep the same end date)')}
        ${better > 1 && html`<p className="calc">Reducing tenure saves ${inr(better)} more in interest. Reducing EMI lowers your monthly outgo instead.</p>`}`
      : html`<p className="calc">${b
          ? html`This reduces the principal${loan.repayment === 'interest' ? ', so every monthly interest payment after it is smaller' : ' you repay at the end, and less interest builds up'}. Interest saved: <strong>${inr(saved(b))}</strong>.`
          : 'Enter the amount and date to see how much interest it saves.'}</p>`}
      <${Field} label="Note" wide><input value=${f.note} onChange=${set('note')} placeholder="e.g. Bonus, bank reference number" /><//>
    </div>
    ${err && html`<p className="err">${err}</p>`}
  <//>`;
}

    <div className="fields">
      <${Field} label="No."><input type="number" min="1" value=${f.no} onChange=${set('no')} /><//>
      <${Field} label="Due date"><input type="date" value=${f.dueDate} onChange=${set('dueDate')} /><//>
      <${Field} label="Amount (₹)"><input type="number" min="0" step="any" value=${f.amount} onChange=${set('amount')} /><//>
      <${Field} label="Principal part (₹)"><input type="number" min="0" step="any" value=${f.principal} onChange=${set('principal')} /><//>
      <${Field} label="Interest part (₹)"><input type="number" min="0" step="any" value=${f.interest} onChange=${set('interest')} /><//>
      <${Field} label="Balance after (₹)"><input type="number" min="0" step="any" value=${f.balance} onChange=${set('balance')} /><//>
      <${Field} label="Status"><select value=${f.status} onChange=${set('status')}><option value="pending">Pending</option><option value="paid">Paid</option></select><//>
      ${f.status === 'paid' && html`<${Field} label="Paid on"><input type="date" value=${f.paidDate || todayISO()} onChange=${set('paidDate')} /><//>`}
      <${Field} label="Note" wide><input value=${f.note} onChange=${set('note')} placeholder="e.g. Paid with penalty" /><//>
    </div>
    ${err && html`<p className="err">${err}</p>`}
  <//>`;
}

/* ---------- tabs ---------- */
function Overview({ data, s, go }) {
  const max = Math.max(1, ...CATS.map(c => s.byCat[c.id]), s.loanToSeller);
  const used = CATS.filter(c => s.byCat[c.id] > 0);
  const recent = [...data.payments].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 5);
  return html`<div className="cols">
    <div>
      <section className="box">
        <h2>Where the money went</h2>
        ${used.length === 0 && s.loanToSeller === 0
          ? html`<div className="empty"><p>Nothing recorded yet. Add your booking advance or any other payment to see the breakdown.</p><button className="btn primary" onClick=${() => go('payments', true)}>Add payment</button></div>`
          : html`
            <div className="legend"><span>Toward land price</span><span className="extra">Additional cost</span></div>
            <div className="bars">
              ${s.loanToSeller > 0 && html`<div><div className="bar-head"><span>Loans paid to seller</span><span>${inr(s.loanToSeller)}</span></div><div className="track"><i style=${{ width: (s.loanToSeller / max * 100) + '%' }} /></div></div>`}
              ${used.map(c => html`<div key=${c.id}>
                <div className="bar-head"><span>${c.label}</span><span>${inr(s.byCat[c.id])}</span></div>
                <div className="track"><i className=${s.byCatToward[c.id] >= s.byCat[c.id] ? '' : 'extra'} style=${{ width: (s.byCat[c.id] / max * 100) + '%' }} /></div>
              </div>`)}
            </div>`}
      </section>
      <section className="box">
        <h2>Recent payments</h2>
        ${recent.length === 0 ? html`<p className="hint">No payments yet.</p>` : html`
          <ul className="recent">${recent.map(p => html`<li key=${p.id}>
            <div><div>${p.description || catById[p.category].label}</div><div className="meta">${fdate(p.date)}, ${catById[p.category].label}</div></div>
            <strong>${inr(p.amount)}</strong></li>`)}</ul>`}
      </section>
    </div>
    <div>
      ${s.totalCost > 0 && html`<section className="box">
        <h2>Land price split</h2>
        <div className="legend">${s.loanToSeller > 0 && html`<span className="loan">Loans</span>`}<span>You paid</span><span className="due">Still to pay</span></div>
        <div className="split" role="img" aria-label=${'Loans ' + inr(s.loanToSeller) + ', you paid ' + inr(s.towardDirect) + ', still to pay ' + inr(s.ownRemaining)}>
          <i className="s-loan" style=${{ width: Math.min(100, s.loanToSeller / s.totalCost * 100) + '%' }} />
          <i className="s-paid" style=${{ width: Math.min(100 - Math.min(100, s.loanToSeller / s.totalCost * 100), s.towardDirect / s.totalCost * 100) + '%' }} />
        </div>
        ${s.overpaid > 0 && html`<p className="calc warn" style=${{ marginBottom: '12px' }}>Loans paid to the seller plus payments marked "Include in land amount" are ${inr(s.overpaid)} more than the land price. Check the land price, the loan amounts, or which payments are included.</p>`}
        <dl className="kv">
          <div><dt>Land price</dt><dd>${inr(s.totalCost)}</dd></div>
          ${s.loanToSeller > 0 && html`<div><dt>Loans paid to seller (${Math.round(s.loanPct * 1000) / 10}%)</dt><dd>${inr(s.loanToSeller)}</dd></div>`}
          <div><dt>Your share (${Math.round((1 - s.loanPct) * 1000) / 10}%)</dt><dd>${inr(s.ownShare)}</dd></div>
          <div><dt>Paid from your share</dt><dd>${inr(s.towardDirect)}</dd></div>
          <div style=${{ borderTop: '1px solid var(--line)', paddingTop: '10px' }}><dt>Your share still to pay</dt><dd>${inr(s.ownRemaining)}</dd></div>
        </dl>
        ${s.loanToSelf > 0 && html`<p className="hint" style=${{ marginTop: '12px', fontSize: '13px' }}>Personal and other loans that came to your account (${inr(s.loanToSelf)}) count here only through the payments you made from them.</p>`}
      </section>`}
      <section className="box">
        <h2>Loans</h2>
        ${data.loans.length === 0
          ? html`<p className="hint" style=${{ marginBottom: '14px' }}>No loans added. Add your land loan, personal loan or gold loan to track every payment.</p><button className="btn" onClick=${() => go('loans')}>Add a loan</button>`
          : html`
            ${s.overdue.length > 0 && html`<p className="alert">${s.overdue.length} loan payment${s.overdue.length > 1 ? 's are' : ' is'} past due and not marked paid.</p>`}
            <ul className="recent" style=${{ marginBottom: '14px' }}>${s.loanStats.map(x => html`<li key=${x.loan.id}>
              <div><div>${loanName(x.loan)}</div><div className="meta">${x.next ? 'Next ' + inr(x.next.amount) + ' on ' + fdate(x.next.dueDate) : x.count ? 'All paid' : 'No schedule yet'}</div></div>
              <div style=${{ textAlign: 'right' }}><strong>${inr(x.outstanding)}</strong><div className="meta">outstanding</div></div></li>`)}</ul>
            <dl className="kv">
              <div><dt>Total borrowed</dt><dd>${inr(s.borrowed)}</dd></div>
              <div><dt>Repaid so far</dt><dd>${inr(s.emiPaid + s.prepaid)}</dd></div>
              <div><dt>Interest paid so far</dt><dd>${inr(s.interestPaid)}</dd></div>
              <div><dt>Total outstanding</dt><dd>${inr(s.loanOutstanding)}</dd></div>
              <div><dt>Total interest over all loans</dt><dd>${inr(s.scheduledInterest)}</dd></div>
            </dl>`}
      </section>
      <section className="box">
        <h2>Full cost of this land</h2>
        <dl className="kv">
          <div><dt>Agreed land price</dt><dd>${inr(s.totalCost)}</dd></div>
          <div><dt>Additional costs so far</dt><dd>${inr(s.additional)}</dd></div>
          <div><dt>Loan interest (full schedules)</dt><dd>${inr(s.scheduledInterest)}</dd></div>
          <div style=${{ borderTop: '1px solid var(--line)', paddingTop: '10px' }}><dt>Projected total</dt><dd>${inr(s.projected)}</dd></div>
        </dl>
      </section>
    </div>
  </div>`;
}

function Payments({ data, onAdd, onEdit, onDelete }) {
  const [filter, setFilter] = useState('all');
  const rows = [...data.payments].filter(p => filter === 'all' || (filter === 'price' ? p.towardPrice : filter === 'extra' ? !p.towardPrice : p.category === filter))
    .sort((a, b) => (a.date < b.date ? 1 : -1));
  const total = rows.reduce((a, p) => a + num(p.amount), 0);
  const mobile = useIsMobile();
  const actions = p => html`<div className="row-actions"><button className="btn quiet small" onClick=${() => onEdit(p)}>Edit</button><button className="btn quiet small danger" onClick=${() => onDelete(p)}>Delete</button></div>`;
  const list = mobile ? html`<div className="cards">
      ${rows.map(p => html`<article key=${p.id} className="card">
        <div className="card-top"><span className=${'pill' + (p.towardPrice ? '' : ' extra')}>${catById[p.category].label}</span><strong>${inr(p.amount)}</strong></div>
        ${p.description && html`<div>${p.description}</div>`}
        <div className="meta">${[fdate(p.date), p.mode, p.paidTo && 'To ' + p.paidTo, p.reference && 'Ref ' + p.reference].filter(Boolean).join(', ')}</div>
        ${actions(p)}
      </article>`)}
      <div className="card-total"><span>${rows.length} payment${rows.length === 1 ? '' : 's'}</span><strong>${inr(total)}</strong></div>
    </div>` : null;
  return html`<div>
    <div className="toolbar">
      <div className="left">
        <label className="visually-hidden" htmlFor="pf">Filter payments</label>
        <select id="pf" className="filter" value=${filter} onChange=${e => setFilter(e.target.value)}>
          <option value="all">All payments</option>
          <option value="price">Toward land price</option>
          <option value="extra">Additional costs</option>
          ${CATS.map(c => html`<option key=${c.id} value=${c.id}>${c.label}</option>`)}
        </select>
      </div>
      <button className="btn primary" onClick=${onAdd}>Add payment</button>
    </div>
    ${data.payments.length === 0
      ? html`<div className="box empty"><p>Record every rupee you spend on this land: the booking advance, payments to the seller, legal checks, registration, broker fees and so on.</p><button className="btn primary" onClick=${onAdd}>Add your first payment</button></div>`
      : mobile ? list
      : html`<div className="table-wrap"><table>
          <thead><tr><th>Date</th><th>For</th><th>Details</th><th>Mode</th><th className="num">Amount</th><th><span className="visually-hidden">Actions</span></th></tr></thead>
          <tbody>${rows.map(p => html`<tr key=${p.id}>
            <td className="nowrap">${fdate(p.date)}</td>
            <td><span className=${'pill' + (p.towardPrice ? '' : ' extra')}>${catById[p.category].label}</span></td>
            <td>${p.description || '—'}${(p.paidTo || p.reference) && html`<div className="meta">${[p.paidTo && 'To ' + p.paidTo, p.reference && 'Ref ' + p.reference].filter(Boolean).join(', ')}</div>`}</td>
            <td className="nowrap">${p.mode || '—'}</td>
            <td className="num"><strong>${inr(p.amount)}</strong></td>
            <td><div className="row-actions"><button className="btn quiet small" onClick=${() => onEdit(p)}>Edit</button><button className="btn quiet small danger" onClick=${() => onDelete(p)}>Delete</button></div></td>
          </tr>`)}</tbody>
          <tfoot><tr><td colSpan="4">${rows.length} payment${rows.length === 1 ? '' : 's'}</td><td className="num">${inr(total)}</td><td></td></tr></tfoot>
        </table></div>`}
  </div>`;
}

function Loans({ data, s, sel, setSel, on }) {
  const [show, setShow] = useState('all');
  const mobile = useIsMobile();
  const today = todayISO();
  if (!data.loans.length) return html`<div className="box empty">
    <p>No loans yet. Add each loan you've taken for this land, such as the land loan from the bank, a personal loan or a gold loan.</p>
    <div className="actions" style=${{ justifyContent: 'center' }}>
      <button className="btn primary" onClick=${() => on.addLoan('land')}>Add land loan</button>
      <button className="btn" onClick=${() => on.addLoan('personal')}>Add personal loan</button>
      <button className="btn" onClick=${() => on.addLoan('gold')}>Add gold loan</button>
    </div></div>`;
  const L = data.loans.find(l => l.id === sel) || data.loans[0];
  const st = s.loanStats.find(x => x.loan.id === L.id);
  const kind = L.repayment, g = L.gold || {};
  const rows = [...L.emis].filter(e => show === 'all' || (show === 'paid' ? e.status === 'paid' : e.status !== 'paid'))
    .sort((a, b) => (a.dueDate > b.dueDate ? 1 : a.dueDate < b.dueDate ? -1 : a.no - b.no));
  const nextAmt = st.next ? st.next.amount : 0;
  const pillCls = t => 'pill' + (t === 'gold' ? ' extra' : t === 'land' ? '' : ' plain');
  const acts = e => html`<div className="row-actions"><button className="btn quiet small" onClick=${() => on.editRow(L.id, e)}>Edit</button><button className="btn quiet small danger" onClick=${() => on.deleteRow(L.id, e)}>Delete</button></div>`;

  const cards = html`<div className="cards">
    ${rows.map(e => {
      const overdue = e.status !== 'paid' && e.dueDate && e.dueDate < today;
      return html`<article key=${e.id} className=${'card' + (e.status === 'paid' ? ' paid' : overdue ? ' overdue' : '')}>
        <div className="card-top">
          <label className="emi-main">
            <input type="checkbox" className="check" checked=${e.status === 'paid'} onChange=${() => on.toggle(L.id, e)} aria-label=${'Mark payment ' + e.no + ' paid'} />
            <span><strong>No. ${e.no}</strong><span className="meta due" style=${{ display: 'block' }}>${e.status === 'paid' ? 'Paid ' + fdate(e.paidDate) : (overdue ? 'Overdue, was due ' : 'Due ') + fdate(e.dueDate)}</span></span>
          </label>
          <strong>${inr(e.amount)}</strong>
        </div>
        <div className="meta">Principal ${inr(e.principal)}, interest ${inr(e.interest)}, balance ${inr(e.balance)}${e.note ? '. ' + e.note : ''}</div>
        ${acts(e)}
      </article>`;
    })}
    <div className="card-total"><span>${rows.length} shown</span><strong>${inr(rows.reduce((a, e) => a + num(e.amount), 0))}</strong></div>
  </div>`;

  const table = html`<div className="table-wrap"><table>
    <thead><tr><th>Paid</th><th>No.</th><th>Due</th><th className="num">Amount</th><th className="num">Principal</th><th className="num">Interest</th><th className="num">Balance</th><th>Paid on</th><th><span className="visually-hidden">Actions</span></th></tr></thead>
    <tbody>${rows.map(e => {
      const overdue = e.status !== 'paid' && e.dueDate && e.dueDate < today;
      return html`<tr key=${e.id} className=${e.status === 'paid' ? 'paid' : overdue ? 'overdue' : ''}>
        <td><input type="checkbox" className="check" checked=${e.status === 'paid'} onChange=${() => on.toggle(L.id, e)} aria-label=${'Mark payment ' + e.no + ' paid'} /></td>
        <td>${e.no}</td>
        <td className="nowrap">${fdate(e.dueDate)}</td>
        <td className="num"><strong>${inr(e.amount)}</strong></td>
        <td className="num">${inr(e.principal)}</td>
        <td className="num">${inr(e.interest)}</td>
        <td className="num">${inr(e.balance)}</td>
        <td className="nowrap">${e.status === 'paid' ? fdate(e.paidDate) : '—'}${e.note && html`<div className="meta">${e.note}</div>`}</td>
        <td>${acts(e)}</td>
      </tr>`;
    })}</tbody>
    <tfoot><tr><td colSpan="3">${rows.length} shown</td>
      <td className="num">${inr(rows.reduce((a, e) => a + num(e.amount), 0))}</td>
      <td className="num">${inr(rows.reduce((a, e) => a + num(e.principal), 0))}</td>
      <td className="num">${inr(rows.reduce((a, e) => a + num(e.interest), 0))}</td><td colSpan="3"></td></tr></tfoot>
  </table></div>`;

  return html`<div>
    <div className="loan-grid">
      ${s.loanStats.map(x => html`<button key=${x.loan.id} className=${'loan-card' + (x.loan.id === L.id ? ' on' : '')} aria-pressed=${x.loan.id === L.id} onClick=${() => setSel(x.loan.id)}>
        <span><span className=${pillCls(x.loan.type)}>${loanTypeById[x.loan.type].label}</span></span>
        <strong>${loanName(x.loan)}</strong>
        <span className="lc-amt">${inr(x.outstanding)} <small>left</small></span>
        <span className="meta">${x.next ? 'Next ' + inr(x.next.amount) + ', ' + fdate(x.next.dueDate) : x.count ? 'All paid' : 'No schedule yet'}</span>
        ${x.overdue.length > 0 && html`<span className="meta" style=${{ color: 'var(--danger)' }}>${x.overdue.length} overdue</span>`}
      </button>`)}
      <button className="loan-card add" onClick=${() => on.addLoan('personal')}>+ Add loan</button>
    </div>

    <section className="box" style=${{ marginBottom: '20px' }}>
      <div className="toolbar">
        <div><h2 style=${{ margin: 0 }}>${loanName(L)}</h2><p className="hint">${[loanTypeById[L.type].label, L.lender, L.accountNo && 'No. ' + L.accountNo].filter(Boolean).join(', ')}</p></div>
        <div className="left">
          <button className="btn primary" onClick=${() => on.prepay(L.id)}>Part payment</button>
          <button className="btn" onClick=${() => on.editLoan(L.id)}>Edit loan</button>
          <button className="btn" onClick=${() => on.rebuild(L.id)}>Rebuild schedule</button>
          <button className="btn quiet danger" onClick=${() => on.deleteLoan(L.id)}>Delete</button>
        </div>
      </div>
      <dl className="kv" style=${{ gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))', columnGap: '28px' }}>
        <div><dt>Loan amount</dt><dd>${inr(L.principal)}</dd></div>
        <div><dt>Interest rate</dt><dd>${num(L.rate)}% a year</dd></div>
        <div><dt>Repayment</dt><dd>${repayById[kind].short}</dd></div>
        <div><dt>Tenure</dt><dd>${Math.round(num(L.tenureMonths)) || '—'} months</dd></div>
        ${L.loanDate && html`<div><dt>Loan date</dt><dd>${fdate(L.loanDate)}</dd></div>`}
        <div><dt>${kind === 'emi' ? 'Current EMI' : kind === 'interest' ? 'Next interest' : 'Due at the end'}</dt><dd>${nextAmt ? inr(nextAmt) : '—'}</dd></div>
        <div><dt>${kind === 'bullet' ? 'Due on' : 'Ends'}</dt><dd>${st.end ? fdate(st.end) : '—'}</dd></div>
        <div><dt>Paid so far</dt><dd>${inr(st.paidAmt)}</dd></div>
        <div><dt>Interest paid</dt><dd>${inr(st.interestPaid)}</dd></div>
        <div><dt>Part payments</dt><dd>${inr(st.prepaid)}</dd></div>
        <div><dt>Outstanding</dt><dd>${inr(st.outstanding)}</dd></div>
        <div><dt>Money went to</dt><dd>${L.use === 'seller' ? 'Seller' : 'My account'}</dd></div>
      </dl>
      ${L.type === 'gold' && html`<div style=${{ marginTop: '16px', borderTop: '1px solid var(--line)', paddingTop: '12px' }}>
        <h3 style=${{ fontSize: '14px', marginBottom: '8px' }}>Gold pledged</h3>
        <dl className="kv" style=${{ gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))', columnGap: '28px' }}>
          <div><dt>Weight</dt><dd>${num(g.weight) ? num(g.weight) + ' g' : '—'}</dd></div>
          <div><dt>Purity</dt><dd>${g.purity || '—'}</dd></div>
          <div><dt>Value at pledge</dt><dd>${st.goldValue ? inr(r2(st.goldValue)) : '—'}</dd></div>
          <div><dt>Loan to value</dt><dd>${st.goldValue ? Math.round(num(L.principal) / st.goldValue * 1000) / 10 + '%' : '—'}</dd></div>
          <div><dt>Pledge / receipt no.</dt><dd>${g.pledgeNo || '—'}</dd></div>
        </dl></div>`}
      ${L.prepayments.length > 0 && html`<div style=${{ marginTop: '16px', borderTop: '1px solid var(--line)', paddingTop: '12px' }}>
        <h3 style=${{ fontSize: '14px', marginBottom: '6px' }}>Part payments</h3>
        <ul className="recent">${[...L.prepayments].sort((a, b) => (a.date > b.date ? 1 : -1)).map(x => html`<li key=${x.id}>
          <div><div><strong>${inr(x.amount)}</strong> on ${fdate(x.date)}</div><div className="meta">${kind !== 'emi' ? 'Reduced principal' : x.mode === 'emi' ? 'Reduced EMI' : 'Reduced tenure'}${x.note ? ', ' + x.note : ''}</div></div>
          <button className="btn quiet small danger" onClick=${() => on.deletePrepay(L.id, x)}>Delete</button></li>`)}</ul>
      </div>`}
    </section>

    <div className="toolbar">
      <div className="left">
        <label className="visually-hidden" htmlFor="ef">Show payments</label>
        <select id="ef" className="filter" value=${show} onChange=${e => setShow(e.target.value)}>
          <option value="all">All payments</option><option value="pending">Pending</option><option value="paid">Paid</option>
        </select>
        <span style=${{ color: 'var(--muted)', fontSize: '14px' }}>Tick each one when you pay it.${st.overdue.length > 0 ? ' ' + st.overdue.length + ' overdue.' : ''}</span>
      </div>
      <button className="btn" onClick=${() => on.addRow(L.id)}>Add row</button>
    </div>
    ${L.emis.length === 0
      ? html`<div className="box empty"><p>No payment schedule yet. Edit the loan and fill in the amount, tenure and dates to create it, or add rows one by one.</p></div>`
      : rows.length === 0 ? html`<div className="box empty"><p>No ${show} payments.</p></div>`
      : mobile ? cards : table}
  </div>`;
}

function Property({ data, update, onReset, drive, extra }) {

    <section className="box">
      <h2>About the land</h2>
      <div className="fields">
        <${Field} label="Name for this purchase" wide><input value=${P.name} onChange=${set('name')} placeholder="e.g. Plot at Padappai" /><//>
        <${Field} label="Location / address" wide><input value=${P.location} onChange=${set('location')} /><//>
        <${Field} label="Survey number"><input value=${P.surveyNo} onChange=${set('surveyNo')} /><//>
        <${Field} label="Area">
          <div style=${{ display: 'flex', gap: '8px' }}>
            <input type="number" min="0" step="any" value=${P.area} onChange=${set('area')} style=${{ flex: 1, minWidth: 0 }} />

        <${Field} label="Agreement date"><input type="date" value=${P.agreementDate} onChange=${set('agreementDate')} /><//>
