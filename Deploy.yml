name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site with the Google client ID
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_CLIENT_ID repository variable is not set. The app will deploy with Drive sync turned off."
          elif ! printf '%s' "$GOOGLE_CLIENT_ID" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::GOOGLE_CLIENT_ID contains unexpected characters. Paste only the client ID."
            exit 1
          fi
          mkdir -p _site
          cp index.html _site/
          for f in logo.svg favicon-32.png apple-touch-icon.png logo-512.png; do
            [ -f "$f" ] && cp "$f" _site/
          done
          sed -i "s/__GOOGLE_CLIENT_ID__/${GOOGLE_CLIENT_ID}/g" _site/index.html
          echo "Built files:" && ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
